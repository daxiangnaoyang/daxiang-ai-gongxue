<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">大象 AI 共学课程地图：三个 Part 与两个选修</title>
  <desc id="desc">三个主课程 Part 从底层逻辑、模型工具到桌面 AI 工作台，下面是 Coze 应用实战与 AIGC 研习系统两个选修模块。</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#6B6B6B" opacity=".16"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#171717" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="820" rx="34" fill="#F5F0E8"/>
  <rect x="18" y="18" width="1564" height="784" rx="26" fill="url(#dots)" opacity=".45"/>
  <g font-family="ZCOOL KuaiLe Local, 'ZCOOL KuaiLe', sans-serif" fill="#171717">
    <text x="800" y="78" text-anchor="middle" font-size="49">AI 共学课程地图</text>
    <path d="M498 94 Q800 112 1102 94" fill="none" stroke="#E8655A" stroke-width="6" stroke-linecap="round"/>
    <text x="800" y="133" text-anchor="middle" font-size="28" fill="#6B6B6B">三个 Part + 两个选修，按需取用</text>
  </g>

  <g stroke="#171717" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)">
    <rect x="70" y="184" width="450" height="404" rx="26" fill="#A8D8EA" transform="rotate(-.7 295 386)"/>
    <rect x="575" y="184" width="450" height="404" rx="26" fill="#B5E5CF" transform="rotate(.6 800 386)"/>
    <rect x="1080" y="184" width="450" height="404" rx="26" fill="#D5C6E0" transform="rotate(-.5 1305 386)"/>
  </g>

  <g font-family="ZCOOL KuaiLe Local, 'ZCOOL KuaiLe', sans-serif" fill="#171717">
    <g>
      <circle cx="118" cy="231" r="25" fill="#E8655A" stroke="#171717" stroke-width="3"/><text x="118" y="241" text-anchor="middle" font-size="22" fill="#F5F0E8">01</text>
      <text x="160" y="226" font-size="27">PART 01｜AI 地基</text><text x="160" y="260" font-size="27">与底层逻辑</text>
      <path d="M104 288H484" stroke="#171717" stroke-width="2" stroke-dasharray="8 9" opacity=".55"/>
      <text x="106" y="326" font-size="20"><tspan x="106" dy="0">DeepSeek 入门、AIGC 通识、</tspan><tspan x="106" dy="31">提示词工程、AI 绘画与视频科普、</tspan><tspan x="106" dy="31">私有化部署避坑、从 0 到 1</tspan><tspan x="106" dy="31">认识智能体。</tspan></text>
      <rect x="106" y="470" width="378" height="72" rx="17" fill="#F5F0E8" stroke="#171717" stroke-width="2"/>
      <text x="295" y="501" text-anchor="middle" font-size="19">先画边界再谈能力</text><text x="295" y="528" text-anchor="middle" font-size="17" fill="#6B6B6B">这是后面一切的基础</text>
    </g>
    <g>
      <circle cx="623" cy="231" r="25" fill="#E8655A" stroke="#171717" stroke-width="3"/><text x="623" y="241" text-anchor="middle" font-size="22" fill="#F5F0E8">02</text>
      <text x="665" y="226" font-size="27">PART 02｜AI 大模型</text><text x="665" y="260" font-size="27">与工具</text>
      <path d="M609 288H989" stroke="#171717" stroke-width="2" stroke-dasharray="8 9" opacity=".55"/>
      <text x="611" y="326" font-size="20"><tspan x="611" dy="0">工具判断框架、信息源、</tspan><tspan x="611" dy="31">API 通识、中转 API 辨别、</tspan><tspan x="611" dy="31">用飞书打造自己的知识库。</tspan></text>
      <rect x="611" y="470" width="378" height="72" rx="17" fill="#F5F0E8" stroke="#171717" stroke-width="2"/>
      <text x="800" y="501" text-anchor="middle" font-size="19">学到什么用什么</text><text x="800" y="528" text-anchor="middle" font-size="17" fill="#6B6B6B">不追新工具</text>
    </g>
    <g>
      <circle cx="1128" cy="231" r="25" fill="#E8655A" stroke="#171717" stroke-width="3"/><text x="1128" y="241" text-anchor="middle" font-size="22" fill="#F5F0E8">03</text>
      <text x="1170" y="226" font-size="27">PART 03｜AI-Agent</text><text x="1170" y="260" font-size="27">桌面 AI 工作台</text>
      <path d="M1114 288H1494" stroke="#171717" stroke-width="2" stroke-dasharray="8 9" opacity=".55"/>
      <text x="1116" y="326" font-size="20"><tspan x="1116" dy="0">Claude Code、Codex、Coze 智能体、</tspan><tspan x="1116" dy="31">OpenClaw &amp; Hermes Agent、</tspan><tspan x="1116" dy="31">OpenCLI 与实战案例。</tspan></text>
      <rect x="1116" y="470" width="378" height="72" rx="17" fill="#F5F0E8" stroke="#171717" stroke-width="2"/>
      <text x="1305" y="501" text-anchor="middle" font-size="19">把 AI 装进桌面工作流</text><text x="1305" y="528" text-anchor="middle" font-size="17" fill="#6B6B6B">一人顶一个团队</text>
    </g>
  </g>

  <path d="M530 382 C545 350 553 350 570 382" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1035 382 C1050 350 1058 350 1075 382" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g stroke="#171717" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)">
    <rect x="230" y="622" width="530" height="112" rx="24" fill="#F4C7AB" transform="rotate(-.5 495 678)"/>
    <rect x="840" y="622" width="530" height="112" rx="24" fill="#F7D96B" transform="rotate(.6 1105 678)"/>
  </g>
  <g font-family="ZCOOL KuaiLe Local, 'ZCOOL KuaiLe', sans-serif" fill="#171717">
    <text x="270" y="660" font-size="22">选修｜Coze 应用实战（2025版）</text>
    <text x="270" y="696" font-size="17" fill="#4D4844">初级 → 中级 → 高级 + 智能体案例汇总 · 想做应用的人按需进入</text>
    <text x="880" y="660" font-size="22">选修｜AIGC 研习系统（持续更新）</text>
    <text x="880" y="696" font-size="17" fill="#4D4844">AI 写作、漫剧、绘图、视频 · 做内容和 IP 的人按项目取用</text>
  </g>
  <g font-family="ZCOOL KuaiLe Local, 'ZCOOL KuaiLe', sans-serif">
    <rect x="404" y="756" width="792" height="43" rx="21" fill="#171717"/>
    <text x="800" y="785" text-anchor="middle" font-size="20" fill="#F5F0E8">新人从哪开始？先看先导课：清晰的学习地图 · 每个 Part 都告诉你要不要学、怎么学</text>
  </g>
  <g fill="#E8655A" font-family="ZCOOL KuaiLe Local, 'ZCOOL KuaiLe', sans-serif" font-size="35"><text x="52" y="157">✦</text><text x="1515" y="160">✧</text><text x="90" y="690">↝</text><text x="1485" y="690">✺</text></g>
</svg>
